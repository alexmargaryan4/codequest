name: iOS Build

# Builds an UNSIGNED IPA for the Flutter app that lives in `flutter_app/`.
#
# There is no Apple Developer signing here on purpose — no certificates,
# no provisioning profiles, no App Store Connect credentials. The output
# is a plain unsigned IPA artifact meant to be signed afterwards on-device
# with a tool like ESign.
#
# Triggers:
#   - Any push to `main` that touches the Flutter app.
#   - Manually, at any time, via the "Run workflow" button (workflow_dispatch).
#
# Secrets required (Settings → Secrets and variables → Actions):
#   OPENAI_API_KEY   (optional but recommended)
#   GROQ_API_KEY     (optional but recommended)
# Both are passed into the Flutter build via --dart-define and are never
# written to disk, logged, or committed anywhere in this workflow.

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch: {}

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Fails the build only on real errors. Style-level warnings/info
        # (unused fields, deprecated_member_use, prefer_const, etc.) are
        # left for local cleanup and never block CI.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build iOS app (no codesign)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --dart-define=GROQ_API_KEY="$GROQ_API_KEY"

      # `flutter build ios --no-codesign` produces an unsigned Runner.app
      # under build/ios/iphoneos. Package it into a standard IPA structure
      # (Payload/Runner.app) by hand, since `flutter build ipa` / xcodebuild
      # -exportArchive both require a signing identity we intentionally
      # don't have here.
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          BUILD_DIR="build/ios/iphoneos"
          PAYLOAD_DIR="$BUILD_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -r "$BUILD_DIR/Runner.app" "$PAYLOAD_DIR/Runner.app"
          cd "$BUILD_DIR"
          zip -r -y codequest-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/ipa-output"
          cp codequest-unsigned.ipa "$GITHUB_WORKSPACE/ipa-output/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: codequest-ios-unsigned-ipa
          path: ipa-output/codequest-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
