name: Android Build

# Builds a release APK for the Flutter app that lives in `flutter_app/`.
#
# Triggers:
#   - Any push to `main` that touches the Flutter app.
#   - Manually, at any time, via the "Run workflow" button (workflow_dispatch) —
#     this is the primary way to trigger builds when working from a phone.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   OPENAI_API_KEY   (optional but recommended)
#   GROQ_API_KEY     (optional but recommended)
# Both are passed into the Flutter build via --dart-define and are never
# written to disk, logged, or committed anywhere in this workflow.

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

# Avoid piling up redundant runs if you push multiple times in a row from
# the GitHub mobile app.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Fails the build only on real errors. Style-level warnings/info
        # (unused fields, deprecated_member_use, prefer_const, etc.) are
        # left for local cleanup and never block CI.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --dart-define=GROQ_API_KEY="$GROQ_API_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codequest-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
